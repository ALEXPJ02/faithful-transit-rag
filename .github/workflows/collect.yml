name: Collect delay observations

# The prediction layer trains on data collected while the project runs — TfNSW
# publishes no historical bus or train GTFS-Realtime archive — so a missed
# window is training data that cannot be recovered. This runs the collector
# somewhere that does not depend on a laptop being awake.
#
# Snapshots are committed to a dedicated `collected-data` branch, not to main:
# at this cadence the collector produces a few hundred commits a day, and main
# is the branch a reader actually looks at.

on:
  schedule:
    # Every 5 minutes — GitHub's floor for scheduled workflows. The scheduler
    # is best-effort and drifts under load, which is why the collector keeps
    # the next few upcoming stops per trip rather than only the next one.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Never run two collectors at once: they would race on the push to the data
# branch. Queue instead of cancelling — a skipped poll is a small gap.
concurrency:
  group: collect-delay-observations
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    name: Poll TfNSW and append a snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # The schedule goes live the moment this file reaches the default
      # branch, which is well before the key exists. Skipping quietly beats
      # 288 failure notifications a day while the repo is still being set up.
      - name: Skip unless the API key is configured
        id: guard
        env:
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
        run: |
          if [ -z "$TFNSW_API_KEY" ]; then
            echo "::notice::TFNSW_API_KEY is not set — nothing to collect yet. \
          Add it under Settings → Secrets and variables → Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out code
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v4

      # Deliberately not actions/checkout: the branch does not exist on the
      # first run, and creating it here removes a manual setup step. Must run
      # after the code checkout, which cleans the workspace.
      - name: Check out (or create) the data branch
        if: steps.guard.outputs.ready == 'true'
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git clone --branch collected-data --single-branch --depth 1 "$REMOTE" .data 2>/dev/null; then
            echo "Using the existing collected-data branch."
          else
            echo "collected-data branch not found — creating it."
            git clone --depth 1 "$REMOTE" .data
            cd .data
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch --orphan collected-data
            mkdir -p observations && touch observations/.gitkeep
            git add observations/.gitkeep
            git commit -q -m "Start collected-data branch"
            git push -u origin collected-data
          fi

      - name: Install uv
        if: steps.guard.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.guard.outputs.ready == 'true'
        run: uv python install

      - name: Install the collector only
        if: steps.guard.outputs.ready == 'true'
        run: uv pip install --system -e ".[realtime]"

      - name: Poll
        if: steps.guard.outputs.ready == 'true'
        env:
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
          # Set as a repository variable if your account's resource path
          # differs from the documented default (docs/05 §3).
          TFNSW_TRIP_UPDATE_URL: ${{ vars.TFNSW_TRIP_UPDATE_URL }}
          COLLECTION_SINK: csv
          COLLECTION_SNAPSHOT_DIR: ${{ github.workspace }}/.data/observations
          COLLECTION_ROUTES_LOOKUP: ${{ github.workspace }}/data/routes_lookup.csv
        run: transit-poller --once --sink csv

      - name: Commit the snapshot
        if: steps.guard.outputs.ready == 'true'
        working-directory: .data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add observations
          if git diff --staged --quiet; then
            echo "Nothing collected this run."
            exit 0
          fi
          git commit -m "collect: $(date -u '+%Y-%m-%dT%H:%MZ')"
          # A queued run can still land between our fetch and push. Rebase and
          # retry rather than failing: snapshot files are immutable and
          # uniquely named, so there is nothing to conflict on.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt) — rebasing onto the branch tip."
            git pull --rebase --autostash origin collected-data
          done
          echo "::error::Could not push collected snapshots after 3 attempts."
          exit 1
