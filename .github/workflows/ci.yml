name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `uv sync --frozen` resolves nothing: it installs exactly what uv.lock
      # pins, into a venv built from .python-version. `uv pip install --system`
      # would instead target whatever interpreter the runner image happens to
      # ship, silently ignoring the pin.
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra realtime --extra prediction

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov=transit_rag --cov-report=term-missing
