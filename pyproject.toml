[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transit-rag"
version = "0.1.0"
description = "An agentic RAG system for real-time Sydney public transport Q&A with automated faithfulness evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Piero Jauregui" }]
keywords = ["rag", "agentic", "gtfs", "public-transport", "llm-evaluation"]

# Base is deliberately tiny — just what config and HTTP need. The delay
# collector reinstalls its environment on every scheduled run, so anything
# in here is paid for hundreds of times a day; the RAG stack in particular
# has no business being installed to poll a protobuf feed.
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Realtime feeds + delay collection. This plus the base is the entire
# footprint of the scheduled collector.
realtime = [
    "gtfs-realtime-bindings>=1.0",
    "protobuf>=4.25",
]
# Retrieval and generation: the static-corpus half of the system.
rag = [
    "anthropic>=0.40",
    "voyageai>=0.3",
    "chromadb>=0.5",
    "pypdf>=5.0",
    "pydantic>=2.7",
]
# Phase 1b prediction layer (see docs/02-tech-stack.md).
prediction = [
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.4",
]
# MCP tool interface + HTTP surface (Phase 2 deployment target).
serve = [
    "mcp>=1.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# Evaluation harness.
evaluation = [
    "ragas>=0.2",
    "pandas>=2.2",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "types-requests",
    "types-protobuf",
]

[project.scripts]
transit-poller = "transit_rag.prediction.collection.poller:main"
transit-reconcile = "transit_rag.prediction.features.cli:main"

[project.urls]
Repository = "https://github.com/ALEXPJ02/faithful-transit-rag"

[tool.hatch.build.targets.wheel]
packages = ["src/transit_rag"]

# ---------------------------------------------------------------------------
# Lint + format (ruff replaces the reference repo's eslint + prettier pair)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

# Third-party packages without bundled type stubs.
[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "voyageai.*",
    "google.transit.*",
    "xgboost.*",
    "sklearn.*",
    "joblib.*",
    "ragas.*",
    "mcp.*",
    # pandas-stubs is deliberately not a dependency: it disagrees with pandas
    # often enough that chasing its false positives costs more than the typing
    # buys on a handful of dataframe transforms.
    "pandas.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# src so the package imports without an editable install; tests so shared
# fixtures and sentinels can be imported by name from the suite's own modules.
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"
markers = [
    "live: hits a real external API (TfNSW / Anthropic / Voyage). Skipped by default.",
]
